name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GEDEFENSE_NDK_VERSION: "27.2.12479018"
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off
  GOFLAGS: -mod=readonly

jobs:
  source-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pinned Go 1.26.8
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false

      - name: Verify source toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          go version
          [[ "$(go env GOVERSION)" == go1.26.8 ]]

      - name: Go and WireGuard source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/wireguard-audit.py
          bash tools/wireguard-parser-check.sh
          bash tools/wireguard-upstream-check.sh
          (
            cd netstack
            go mod verify
            go vet ./...
            go test ./...
            go test -race ./...
            go test -tags=gdandroidhelper ./...
          )

  android-release-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pinned JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup pinned Go 1.26.8
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false

      - name: Verify runner Android tooling
        shell: bash
        run: |
          set -euo pipefail
          java -version
          go version
          [[ "$(go env GOVERSION)" == go1.26.8 ]]
          [[ "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.specification.version = //p' | head -1)" == "17" ]]
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"

      - name: Install exact Android SDK and NDK inputs
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${GEDEFENSE_NDK_VERSION}"
          NDK_ROOT="$ANDROID_HOME/ndk/${GEDEFENSE_NDK_VERSION}"
          test -f "$NDK_ROOT/source.properties"
          grep -Eq '^Pkg\.Revision = 27\.2\.12479018$' "$NDK_ROOT/source.properties"
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang"

      - name: Android release compile, artifacts and zero-warning lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :core:coreCheck \
            :app:compileReleaseKotlin \
            :app:assembleRelease \
            :app:bundleRelease \
            :app:lintRelease
          python3 tools/lint-zero-audit.py

      - name: Full release-readiness verification
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${GEDEFENSE_NDK_VERSION}"
          bash tools/release-readiness.sh
